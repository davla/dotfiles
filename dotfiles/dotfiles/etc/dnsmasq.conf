# dnsmasq configuration file.
# dnsmasq is only used for local wildcard domain resolution.
#
# {{@@ header() @@}}

# Local wildcard domains
{%@@ for domain in local_penneo_domains -@@%}
    address=/{{@@ domain @@}}/{{@@ local_penneo_addr @@}}
{%@@ endfor @@%}

listen-address={{@@ dnsmasq_addr @@}},::3
# Run alongside other DNS servers
bind-interfaces

# Disable DNS query forwarding. That's systemd-resolved's job
no-hosts
no-resolv
no-poll

# Logging to STDOUT. The systemd service file configures system logging
log-queries
log-facility=-
