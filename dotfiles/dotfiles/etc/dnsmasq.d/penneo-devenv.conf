# dnsmasq configuration file for Penneo devenv local development environment
#
# {{@@ header() @@}}

# Local wildcard domains
{%@@ for domain in local_penneo_domains -@@%}
    address=/{{@@ domain @@}}/{{@@ local_penneo_addr @@}}
{%@@ endfor @@%}

listen-address={{@@ dnsmasq_addr @@}},::1
# Run alongside other DNS servers
bind-interfaces
